[project]
name = "ghostads"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3"]

[dependency-groups]
dev = [
    "opencv-contrib-python-headless>=5.0.0.93",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostsim", "ghostrender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*unverified placeholder.*"]
