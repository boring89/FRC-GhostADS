[project]
name = "ghostads"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "fast-simplification>=0.2.0",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pytest>=8",
    "scipy>=1.17.1",
    "trimesh>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostsim", "ghostrender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*unverified placeholder.*"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
